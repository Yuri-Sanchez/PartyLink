services:
  postgres:
    image: postgres:14-alpine
    container_name: partylink-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - 5432:5432

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partylink -d partylink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: